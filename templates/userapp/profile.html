{% extends 'base.html' %}
{% block title %}Profile | Book & Novel{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <h2 class="mb-4 fade-in">Your Profile</h2>
    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-primary">Save</button>
    </form>
    <a href="{% url 'order_history' %}" class="btn btn-outline-secondary mt-4">View Order History</a>
    {% if profile.avatar %}
      <img src="{{ profile.avatar.url }}" class="img-thumbnail mt-3" style="max-width:120px;">
    {% endif %}
  </div>
</div>
{% endblock %}
